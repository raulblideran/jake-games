<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pip-Boy Inventory</title>
        <link rel="icon" href="favicon.ico" sizes="48x48" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script src="theme-palette.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            // Monochrome phosphor: every palette core uses becomes a green ramp,
            // except losses (red), which glow amber so they stay readable.
            const G = ramp("#d4ffe2", "#021a0b");
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            accent: "#41ff8a",
                            "accent-dim": "#1a9e4c",
                            ink: "#021208",
                            surface: "#04200f",
                            white: "#c8ffd9",
                            black: "#010a04",
                            zinc: G,
                            emerald: G,
                            cyan: G,
                            purple: G,
                            amber: ramp("#fff2c4", "#3a2a00"),
                            red: ramp("#ffe6a8", "#3d2a00"),
                        },
                        animation: {
                            fadeIn: "fadeIn 0.15s steps(3)",
                            fadeInUp: "fadeIn 0.2s steps(3)",
                            slideUp: "fadeIn 0.2s steps(4)",
                        },
                        keyframes: { fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } } },
                    },
                },
            };
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="collection-base.css" />
        <link rel="stylesheet" href="theme-kit.css" />
        <style>
            :root {
                --accent: #41ff8a;
                --accent-rgb: 65, 255, 138;
                --accent-dim: #1a9e4c;
                --accent-soft: #8dffb6;
                --accent-ink: #021208;
                --surface: #04200f;
                --ink: #021208;
                --g: #41ff8a;
                --g-rgb: 65, 255, 138;
                --g-dim: #1d8c48;
                --g-faint: rgba(65, 255, 138, 0.12);
                --amber: #ffd25a;
                --tnav-bg: #010a04;
                --tnav-border: rgba(65, 255, 138, 0.3);
                --tnav-fg: #41ff8a;
                --tnav-muted: #1d8c48;
                --tnav-btn-border: rgba(65, 255, 138, 0.3);
                --tnav-active-bg: #41ff8a;
                --tnav-active-fg: #021208;
                --tnav-radius: 0;
                --tnav-font: "Share Tech Mono", monospace;
                --tnav-hover-fg: #c8ffd9;
            }
            html { background: #010603; }
            body {
                font-family: "Share Tech Mono", monospace;
                color: var(--g);
                background: radial-gradient(ellipse at center, #052a13 0%, #021208 60%, #010603 100%);
                background-attachment: fixed;
                min-height: 100vh;
                text-shadow: 0 0 6px rgba(var(--g-rgb), 0.55);
                letter-spacing: 0.02em;
            }
            ::selection { background: var(--g); color: #021208; }
            /* CRT overlay: scanlines, roll bar, vignette, flicker */
            .crt {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 595;
                background:
                    radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%),
                    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px);
                animation: flick 6s infinite steps(1);
            }
            .crt::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                height: 22vh;
                background: linear-gradient(transparent, rgba(var(--g-rgb), 0.06), transparent);
                animation: roll 5s linear infinite;
            }
            @keyframes roll { from { top: -22vh; } to { top: 100%; } }
            @keyframes flick { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.85; } 98% { opacity: 1; } 99% { opacity: 0.9; } }
            .frame {
                position: relative;
                z-index: 2;
                max-width: 1500px;
                margin: 18px auto 90px;
                padding: 20px 26px 30px;
                border: 2px solid rgba(var(--g-rgb), 0.35);
                border-radius: 26px / 20px;
                box-shadow: inset 0 0 80px rgba(var(--g-rgb), 0.12), 0 0 40px rgba(var(--g-rgb), 0.08);
            }
            @media (max-width: 640px) { .frame { margin: 8px 6px 90px; padding: 14px 12px 24px; border-radius: 14px; } }

            /* ---- Tabs --------------------------------------------------- */
            .tabs { display: flex; justify-content: space-around; border-bottom: 2px solid var(--g); position: relative; }
            .tab {
                font-family: "VT323", monospace;
                font-size: clamp(22px, 3vw, 34px);
                padding: 2px 16px 0;
                color: var(--g-dim);
                cursor: pointer;
                position: relative;
                top: 2px;
                border: 2px solid transparent;
                border-bottom: 0;
                background: none;
                text-shadow: inherit;
            }
            .tab:hover { color: var(--g); }
            .tab.on { color: var(--g); border-color: var(--g); background: #021208; }
            .subhead { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; margin: 10px 0 16px; color: var(--g-dim); }
            .subhead b { color: var(--g); font-weight: 400; }
            .pane { display: none; }
            .pane.on { display: block; animation: fadeIn 0.2s steps(3); }

            /* ---- STAT --------------------------------------------------- */
            .stat-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
            @media (min-width: 900px) { .stat-grid { grid-template-columns: 340px 1fr; } }
            .vault-fig { width: 100%; max-width: 300px; margin: 0 auto; display: block; filter: drop-shadow(0 0 6px rgba(var(--g-rgb), 0.6)); animation: bob 2.4s ease-in-out infinite; }
            @keyframes bob { 50% { transform: translateY(-6px); } }
            .cond-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; font-size: 12px; text-align: center; }
            .cond-bars div div { height: 6px; border: 1px solid var(--g); margin-top: 3px; }
            .cond-bars i { display: block; height: 100%; background: var(--g); }
            .special { display: flex; flex-direction: column; gap: 3px; }
            .sp {
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: 12px;
                padding: 6px 10px;
                cursor: default;
                border: 1px solid transparent;
            }
            .sp:hover, .sp.sel { background: var(--g); color: #021208; text-shadow: none; }
            .sp-name { font-family: "VT323", monospace; font-size: 26px; line-height: 1; }
            .sp-name small { font-family: "Share Tech Mono", monospace; font-size: 12px; opacity: 0.75; margin-left: 10px; }
            .sp-val { font-family: "VT323", monospace; font-size: 30px; }
            .sp-desc { min-height: 60px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--g-dim); font-size: 13px; line-height: 1.5; }
            .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; margin-top: 22px; }
            .kv div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(var(--g-rgb), 0.25); }

            .box { border: 1px solid rgba(var(--g-rgb), 0.4); padding: 14px 16px; margin-top: 24px; }
            .box-h { font-family: "VT323", monospace; font-size: 24px; margin: -26px 0 8px -4px; display: inline-block; padding: 0 6px; background: #031a0b; }
            .kit-total-label { font-size: 11px; color: var(--g-dim); text-transform: uppercase; letter-spacing: 0.1em; }
            .kit-total-value { font-family: "VT323", monospace; font-size: 30px; line-height: 1; }
            .kit-total-value.is-down { color: var(--amber); text-shadow: 0 0 6px rgba(255, 210, 90, 0.6); }
            .kit-status { color: var(--g-dim); }

            /* ---- Buttons ----------------------------------------------- */
            .ghost-btn, .accent-btn, .seg button, .chip {
                font-family: "Share Tech Mono", monospace;
                border-radius: 0;
                color: var(--g);
                background: transparent;
                border: 1px solid rgba(var(--g-rgb), 0.45);
                text-transform: uppercase;
                font-size: 13px;
                text-shadow: inherit;
            }
            .ghost-btn:hover, .accent-btn:hover, .seg button:hover, .chip:hover, .seg button.active, .chip.active {
                background: var(--g);
                color: #021208;
                border-color: var(--g);
                text-shadow: none;
            }
            .accent-btn { border-width: 2px; }
            .seg { border-radius: 0; border-color: rgba(var(--g-rgb), 0.45); }
            .seg button { border: 0; border-right: 1px solid rgba(var(--g-rgb), 0.45); }
            .kit-search input { background: transparent; border: 1px solid var(--g); color: var(--g); font-family: "Share Tech Mono", monospace; text-shadow: inherit; }
            .kit-search input::placeholder { color: var(--g-dim); }
            .kit-search input:focus { box-shadow: 0 0 14px rgba(var(--g-rgb), 0.35); }
            .kit-dropdown { background: #021208; border: 1px solid var(--g); }
            .kit-badge { background: var(--g); color: #021208; border-radius: 0; text-shadow: none; }
            .kit-panel:not(.collapsed) { padding-top: 16px; border-top: 1px dashed rgba(var(--g-rgb), 0.4); }
            .kit-summary { color: var(--g-dim); font-size: 12px; }
            #breakdownSection { max-height: none !important; }

            /* ---- INV --------------------------------------------------- */
            #cardsGrid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 18px; }
            @media (min-width: 960px) { #cardsGrid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
            .inv-list { display: flex; flex-direction: column; }
            .inv-row {
                display: grid;
                grid-template-columns: 16px minmax(0, 1fr) auto auto;
                gap: 10px;
                align-items: center;
                padding: 4px 8px;
                font-size: 15px;
                cursor: pointer;
                border: 1px solid transparent;
            }
            .inv-row:hover, .inv-row.sel { background: var(--g); color: #021208; text-shadow: none; }
            .inv-row:hover .dim, .inv-row.sel .dim { color: #021208; }
            .inv-row .mark { font-size: 11px; }
            .inv-row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .inv-row .dim { color: var(--g-dim); font-size: 12px; white-space: nowrap; }
            .inv-row .v { font-family: "VT323", monospace; font-size: 22px; line-height: 1; min-width: 70px; text-align: right; }
            .inv-row.tbc { opacity: 0.6; }
            .inv-row .down { color: var(--amber); }
            .inv-row:hover .down, .inv-row.sel .down { color: #3a2a00; }
            .inv-head { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 10px; padding: 0 8px 6px; font-size: 11px; color: var(--g-dim); border-bottom: 1px solid var(--g-dim); margin-bottom: 4px; }
            .inv-detail { position: sticky; top: 64px; align-self: start; border: 1px solid rgba(var(--g-rgb), 0.4); padding: 16px; display: none; }
            @media (min-width: 960px) { .inv-detail { display: block; } }
            .inv-art { position: relative; width: 62%; margin: 0 auto 14px; aspect-ratio: 3 / 4; border: 1px solid var(--g-dim); overflow: hidden; background: repeating-linear-gradient(45deg, rgba(var(--g-rgb), 0.06) 0 6px, transparent 6px 12px); }
            .inv-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3.5) brightness(0.85) contrast(1.2); mix-blend-mode: screen; }
            .inv-art .noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "VT323", monospace; font-size: 80px; color: var(--g-dim); }
            .inv-title { font-family: "VT323", monospace; font-size: 34px; line-height: 1; margin-bottom: 10px; }
            .inv-stats div { display: flex; justify-content: space-between; padding: 5px 8px; font-size: 14px; }
            .inv-stats div:nth-child(odd) { background: var(--g-faint); }
            .inv-hint { margin-top: 12px; font-size: 12px; color: var(--g-dim); text-align: center; animation: blink 1.2s steps(2) infinite; }
            @keyframes blink { 50% { opacity: 0.3; } }
            .cond { border-radius: 0; width: 18px; height: 18px; font-size: 10px; }
            .delta-up { color: var(--g); }
            .delta-down { color: var(--amber); }

            /* ---- DATA / MAP / RADIO -------------------------------------- */
            .data-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
            .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); grid-auto-rows: 90px; gap: 6px; }
            .terr {
                border: 1px solid var(--g);
                padding: 10px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                cursor: pointer;
                position: relative;
                background: repeating-linear-gradient(135deg, rgba(var(--g-rgb), calc(var(--d) * 0.25)) 0 3px, transparent 3px 7px);
            }
            .terr:hover { background: var(--g); color: #021208; text-shadow: none; }
            .terr b { font-family: "VT323", monospace; font-size: 24px; font-weight: 400; line-height: 1; }
            .terr span { font-size: 12px; }
            .terr::after { content: "◉"; position: absolute; top: 8px; right: 10px; font-size: 14px; animation: blink 1.6s steps(2) infinite; }
            .radio-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
            @media (min-width: 900px) { .radio-grid { grid-template-columns: 300px 1fr; } }
            .station { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: 16px; color: var(--g); text-shadow: inherit; }
            .station:hover, .station.on { background: var(--g); color: #021208; text-shadow: none; }
            #wave { width: 100%; height: 260px; border: 1px solid var(--g-dim); background: linear-gradient(var(--g-faint) 1px, transparent 1px) 0 0 / 100% 26px, linear-gradient(90deg, var(--g-faint) 1px, transparent 1px) 0 0 / 26px 100%; }

            /* ---- Status bar ------------------------------------------- */
            .status {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 300;
                display: grid;
                grid-template-columns: auto 1fr auto auto;
                gap: 16px;
                align-items: center;
                padding: 8px 20px;
                background: #021208;
                border-top: 2px solid var(--g);
                font-size: 14px;
            }
            .status .xp { display: flex; align-items: center; gap: 10px; }
            .status .xp div { flex: 1; height: 10px; border: 1px solid var(--g); }
            .status .xp i { display: block; height: 100%; background: var(--g); transition: width 1s steps(20); }
            @media (max-width: 640px) { .status { grid-template-columns: 1fr 1fr; font-size: 12px; padding: 6px 10px; } .status .xp { grid-column: span 2; order: 3; } }

            /* ---- Table / wall / shelf ----------------------------------- */
            #tableWrap { border: 1px solid rgba(var(--g-rgb), 0.4); margin-top: 18px; }
            .gtable { font-family: "Share Tech Mono", monospace; }
            .gtable th { background: #021208; color: var(--g); border-bottom: 1px solid var(--g); }
            .gtable td { color: var(--g) !important; border-bottom: 1px dashed rgba(var(--g-rgb), 0.2); }
            .gtable tbody tr:hover { background: var(--g); }
            .gtable tbody tr:hover td, .gtable tbody tr:hover td * { color: #021208 !important; text-shadow: none; }
            .gtable img, .wall-tile img { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3.5) brightness(0.85); }
            #wallView, #shelfView { margin-top: 18px; }
            .wall-tile { background: #031a0b; border: 1px solid var(--g-dim); }
            .wall-tile:hover { outline: 2px solid var(--g); }
            #shelfView { background: repeating-linear-gradient(to bottom, transparent 0, transparent 178px, var(--g-dim) 178px, var(--g) 180px, transparent 181px, transparent 214px), transparent; border: 1px solid var(--g-dim); border-radius: 0; }
            .spine { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3) brightness(0.9); text-shadow: none; }

            .bar-track { background: var(--g-faint); border-radius: 0; }
            .bar-fill, .vbar, .spark div { background: var(--g); border-radius: 0; box-shadow: 0 0 6px var(--g); }
            .hm-cell { border-radius: 0; background: var(--g-faint); }
            .hm-cell[data-n="1"] { background: #0f5a2a; }
            .hm-cell[data-n="2"] { background: #1a9e4c; }
            .hm-cell[data-n="3"] { background: #2fd46e; }
            .hm-cell[data-n="4"] { background: #8dffb6; }

            /* ---- Overlays & modal --------------------------------------- */
            .ov { background: rgba(1, 10, 4, 0.94); }
            .ov-panel.ov-card { background: #021208; border: 2px solid var(--g); padding: 24px; }
            .ov-title { font-family: "VT323", monospace; font-size: 46px; font-weight: 400; }
            .ov-sub, .ov-roll-console { color: var(--g-dim); }
            .ov-kicker { font-family: "VT323", monospace; font-size: 26px; margin-bottom: 14px; }
            .ov-roll-cover { border: 2px solid var(--g); }
            .ov-roll-cover img, #guessBody img, #modalPoster { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3.5) brightness(0.85) contrast(1.2); }
            .ov-roll-title { font-family: "VT323", monospace; font-size: 40px; }
            .ov-arrow, .ov-x { color: var(--g); }
            #wrappedOverlay { background: radial-gradient(ellipse at center, #052a13, #010603); }
            #wrappedSlide .text-6xl, #wrappedSlide .text-7xl, #wrappedSlide .text-4xl { font-family: "VT323", monospace; font-weight: 400; }
            .trophy { border-radius: 0; background: transparent; border-color: rgba(var(--g-rgb), 0.35); }
            .trophy.unlocked { border-color: var(--g); background: var(--g-faint); }
            .trophy .text-2xl { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(3); }
            .health-row { background: transparent !important; }
            .kit-modal { background: rgba(1, 10, 4, 0.92); }
            .kit-modal-box { background: #021208; border: 2px solid var(--g); box-shadow: 0 0 40px rgba(var(--g-rgb), 0.25), inset 0 0 60px rgba(var(--g-rgb), 0.08); }
            #modalBody h2 { font-family: "VT323", monospace; font-weight: 400 !important; font-size: 46px !important; }
            #modalBody a { color: var(--g); }
            .kit-modal-close, .kit-modal-nav { border-radius: 0; background: #021208; border: 1px solid var(--g); color: var(--g); font-family: "VT323", monospace; }
            .kit-modal-close:hover, .kit-modal-nav:hover { background: var(--g); color: #021208; }
            .kit-toast { background: #021208; border: 1px solid var(--g); color: var(--g); }
            .kit-toast-error { color: var(--amber); border-color: var(--amber); }
            .kit-toasts { bottom: 60px; }
            .kit-pop .note { background: #021208; border: 1px solid var(--g); padding: 8px 16px; color: var(--g); }
            .kit-loading { background: rgba(1, 10, 4, 0.95); }
            .kit-loading-panel { font-family: "VT323", monospace; font-size: 28px; }
            .kit-sfx { padding: 6px 12px; border: 1px solid rgba(var(--g-rgb), 0.45); font-size: 13px; text-transform: uppercase; color: var(--g); text-shadow: inherit; }
            .kit-sfx.on, .kit-sfx:hover { background: var(--g); color: #021208; text-shadow: none; }
            .ext a { border: 1px solid rgba(var(--g-rgb), 0.45); padding: 6px 12px; font-size: 13px; text-transform: uppercase; }
            .ext a:hover { background: var(--g); color: #021208; text-shadow: none; }

            .boot {
                position: fixed;
                inset: 0;
                z-index: 1000;
                background: #010603;
                padding: 40px;
                font-size: 16px;
                white-space: pre-wrap;
                cursor: pointer;
                transition: opacity 0.3s steps(3);
            }
            .boot.done { opacity: 0; pointer-events: none; }
            @media (prefers-reduced-motion: reduce) { .crt, .crt::after, .vault-fig { animation: none; } .boot { display: none; } }
        </style>
    </head>
    <body>
        <div class="crt"></div>
        <div class="boot" id="boot" onclick="this.classList.add('done')"></div>

        <div class="frame">
            <div class="tabs" id="tabs">
                <button class="tab on" data-pane="stat">STAT</button>
                <button class="tab" data-pane="inv">INV</button>
                <button class="tab" data-pane="data">DATA</button>
                <button class="tab" data-pane="map">MAP</button>
                <button class="tab" data-pane="radio">RADIO</button>
            </div>

            <!-- STAT -->
            <section class="pane on" id="pane-stat">
                <div class="subhead"><span><b>STATUS</b> &nbsp; S.P.E.C.I.A.L. &nbsp; PERKS</span><span class="ext flex gap-2 flex-wrap"><a href="achievements.html">Achievements</a><a href="stats.html">Stats</a><span id="sfxSlot"></span></span></div>
                <div id="stats"></div>
                <div class="box">
                    <span class="box-h">CAPS LEDGER</span>
                    <div data-kit="value"></div>
                </div>
            </section>

            <!-- INV -->
            <section class="pane" id="pane-inv">
                <div class="subhead"><span><b>GAMES</b> &nbsp; <span id="invCount"></span></span><span>↑↓ to browse · ENTER to inspect</span></div>
                <div data-kit="controls"></div>
                <div id="cardsGrid"></div>
                <div id="tableWrap" class="hidden overflow-x-auto scroll-thin"></div>
                <div id="wallView" class="hidden"></div>
                <div id="shelfView" class="hidden"></div>
            </section>

            <!-- DATA -->
            <section class="pane" id="pane-data">
                <div class="subhead"><span><b>QUESTS</b> &nbsp; WORKSHOPS &nbsp; STATS</span></div>
                <div class="data-actions">
                    <button class="ghost-btn" onclick="openTrophies()">▸ Quests (achievements)</button>
                    <button class="ghost-btn" onclick="openWrapped()">▸ Holotapes (wrapped)</button>
                    <button class="ghost-btn" onclick="openGuess()">▸ Barter (guess price)</button>
                    <button class="ghost-btn" onclick="openHealth()">▸ RadAway (data health)</button>
                    <button class="ghost-btn" onclick="rollRandomGame()">▸ Random encounter</button>
                    <button class="ghost-btn" onclick="printInventory()">▸ Print terminal log</button>
                </div>
                <div id="dataSlot"></div>
            </section>

            <!-- MAP -->
            <section class="pane" id="pane-map">
                <div class="subhead"><span><b>WORLD MAP</b> &nbsp; LOCAL</span><span>Select a location to fast-travel to its games</span></div>
                <div class="map" id="map"></div>
            </section>

            <!-- RADIO -->
            <section class="pane" id="pane-radio">
                <div class="subhead"><span><b>RADIO</b></span></div>
                <div class="radio-grid">
                    <div id="stations"></div>
                    <canvas id="wave" width="900" height="260"></canvas>
                </div>
            </section>
        </div>

        <div class="status">
            <span id="stHp">HP 0/0</span>
            <span class="xp"><span id="stLvl">LEVEL 1</span><div><i id="stXp" style="width:0"></i></div></span>
            <span id="stAp">AP 0/0</span>
            <span id="stCaps">CAPS 0</span>
        </div>

        <script>
            window.THEME = {
                sfxDemo: "blip",
                labels: {
                    search: "> SEARCH INVENTORY  ( / )",
                    grid: "Inventory",
                    table: "Terminal",
                    wall: "Holo",
                    shelf: "Shelf",
                    refresh: "Sync",
                    breakdown: "Data",
                    filters: "Filter",
                    roll: "🎲",
                    cex: "Barter value scan",
                    total_value: "Caps value",
                    rollTitle: "Random encounter",
                    trophyTitle: "Quests",
                    healthTitle: "RadAway diagnostics",
                    guessTitle: "Barter: guess the price",
                    close: "[ Exit ]",
                    empty: "> NO MATCHING ITEMS IN INVENTORY",
                },
                loadingHTML: `<div>LOADING MASTER HOLOTAPE…</div><div style="font-size:20px;margin-top:6px">▮▮▮▮▮▯▯▯▯▯</div>`,
            };
        </script>
        <script src="theme-kit.js"></script>
        <script src="collection-core.js"></script>
        <script>
            (function () {
                kit.install();
                document.getElementById("sfxSlot").outerHTML = kit.sfxButton();

                // ---- Boot text ---------------------------------------------------
                const boot = document.getElementById("boot");
                let booted = false;
                try {
                    booted = sessionStorage.getItem("pipBooted") === "1";
                    sessionStorage.setItem("pipBooted", "1");
                } catch (e) {}
                if (booted) boot.remove();
                else {
                    const lines = [
                        "PIP-OS(R) V7.1.0.8",
                        "COPYRIGHT 2075 VAULT SYSTEMS",
                        "LOADER V1.1",
                        "EXEC VERSION 41.10",
                        "64K RAM SYSTEM",
                        "38911 BYTES FREE",
                        "NO HOLOTAPE FOUND",
                        "LOAD ROM(1): COLLECTION.DAT",
                        "",
                        "> INITIALISING INVENTORY . . . OK",
                        "> CONTACTING CeX TRADING NETWORK . . . OK",
                    ];
                    let i = 0;
                    const step = () => {
                        boot.textContent = lines.slice(0, ++i).join("\n") + "\n█";
                        if (i < lines.length) setTimeout(step, 90);
                        else setTimeout(() => boot.classList.add("done"), 500);
                    };
                    step();
                }

                // ---- Tabs ----------------------------------------------------------
                const showPane = (name) => {
                    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.pane === name));
                    document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === "pane-" + name));
                    try { sessionStorage.setItem("pipTab", name); } catch (e) {}
                    kit.sfx("blip");
                    if (name === "radio") startWave();
                };
                document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => showPane(t.dataset.pane)));
                // Land on INV when arriving with filters in the URL.
                let startTab = "stat";
                try { startTab = sessionStorage.getItem("pipTab") || "stat"; } catch (e) {}
                if (location.search) startTab = "inv";
                showPane(startTab);

                // Breakdown lives permanently open on the DATA tab.
                const bd = document.getElementById("breakdownSection");
                document.getElementById("dataSlot").appendChild(bd);
                bd.classList.remove("collapsed");
                window.toggleBreakdown = () => showPane("data");
                window.toggleFilters = () => togglePanel("filtersSection", "filterToggleIcon", null);
                const coreFilterToConsole = window.filterToConsole;
                window.filterToConsole = (name) => {
                    showPane("inv");
                    coreFilterToConsole(name);
                };
                const coreFilterToSeries = window.filterToSeries;
                window.filterToSeries = (name) => {
                    showPane("inv");
                    coreFilterToSeries(name);
                };

                // ---- STAT: S.P.E.C.I.A.L. ---------------------------------------------
                const vault = `
                    <svg class="vault-fig" viewBox="0 0 200 260" fill="none" stroke="#41ff8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="100" cy="52" r="32"/>
                        <path d="M84 46 q4 -5 8 0 M108 46 q4 -5 8 0"/>
                        <path d="M84 64 q16 14 32 0"/>
                        <path d="M70 34 q30 -26 60 0 q-14 -8 -30 -6 q-12 -10 -30 6z" fill="#41ff8a" fill-opacity="0.25"/>
                        <path d="M76 92 h48 l10 70 h-68z"/>
                        <path d="M76 98 l-28 36 l10 8"/>
                        <path d="M124 98 l26 -26"/>
                        <path d="M150 72 v-18 q0 -6 6 -6 q6 0 6 6 v14 h8 q8 0 6 8 l-4 16 q-2 6 -10 6 h-12"/>
                        <path d="M80 162 l-6 70 h-16 M120 162 l6 70 h16"/>
                        <text x="100" y="140" fill="#41ff8a" stroke="none" font-family="VT323" font-size="20" text-anchor="middle">101</text>
                    </svg>`;
                const DESCS = {};
                window.displayStats = function () {
                    const s = kit.stats();
                    const editions = new Set(s.owned.map(editionOf)).size;
                    const avg = s.games ? s.paid / s.games : 0;
                    const clamp10 = (n) => Math.max(1, Math.min(10, Math.round(n)));
                    const special = [
                        ["S", "Strength", "games carried", clamp10(s.games / 30), `Carrying ${s.games} games. Every 30 adds a point of Strength.`],
                        ["P", "Perception", "priced at CeX", clamp10((s.priced / Math.max(1, s.games)) * 10), `${s.priced} of ${s.games} games have a live CeX price.`],
                        ["E", "Endurance", "consoles", clamp10(s.consoles), `Surviving across ${s.consoles} different consoles.`],
                        ["C", "Charisma", "editions", clamp10(editions * 1.5), `${editions} different editions on the shelf — Steelcases, GOTYs and all.`],
                        ["I", "Intelligence", "complete in box", clamp10((s.complete / Math.max(1, s.games)) * 10), `${s.complete} of ${s.games} games have every piece the box came with.`],
                        ["A", "Agility", "finished", clamp10(s.completedPct / 10 + 1), `${s.completed} games completed (${s.completedPct}%).`],
                        ["L", "Luck", "return on spend", clamp10(5 + s.gainPct / 10), `Spent ${fmtMoney(s.paid)}, worth ${fmtMoney(s.value)}: ${fmtSigned(s.gain)} (${s.gainPct >= 0 ? "+" : "−"}${Math.abs(s.gainPct)}%).`],
                    ];
                    special.forEach((sp) => (DESCS[sp[0]] = sp[4]));
                    const pct = (n) => `${Math.max(0, Math.min(100, n))}%`;
                    document.getElementById("stats").innerHTML = `
                        <div class="stat-grid">
                            <div>
                                ${vault}
                                <div class="cond-bars">
                                    <div>COMPLETED<div><i style="width:${pct(s.completedPct)}"></i></div></div>
                                    <div>IN BOX<div><i style="width:${pct((s.complete / Math.max(1, s.games)) * 100)}"></i></div></div>
                                    <div>PRICED<div><i style="width:${pct((s.priced / Math.max(1, s.games)) * 100)}"></i></div></div>
                                </div>
                            </div>
                            <div>
                                <div class="special">
                                    ${special.map(([k, name, unit, v]) => `<div class="sp" data-k="${k}"><span class="sp-name">${name}<small>${unit}</small></span><span class="sp-val">${v}</span></div>`).join("")}
                                </div>
                                <div class="sp-desc" id="spDesc">${special[0][4]}</div>
                                <div class="kv">
                                    <div><span>GAMES</span><span>${s.games}</span></div>
                                    <div><span>CONSOLES</span><span>${s.consoles}</span></div>
                                    <div><span>CAPS SPENT</span><span>${fmtMoney(s.paid)}</span></div>
                                    <div><span>AVG PER GAME</span><span>${fmtMoney(avg)}</span></div>
                                    <div><span>SEALED</span><span>${s.sealed}</span></div>
                                    ${s.toBuy > 0 ? `<div><span>WANTED</span><span>${s.toBuy}</span></div>` : ""}
                                </div>
                            </div>
                        </div>`;
                    document.querySelectorAll(".sp").forEach((el) => {
                        el.onmouseenter = () => {
                            document.querySelectorAll(".sp").forEach((x) => x.classList.toggle("sel", x === el));
                            document.getElementById("spDesc").textContent = DESCS[el.dataset.k];
                            kit.sfx("blip");
                        };
                    });

                    const lvl = Math.floor(s.games / 10) + 1;
                    document.getElementById("stHp").textContent = `HP ${s.completed}/${s.games}`;
                    document.getElementById("stLvl").textContent = `LEVEL ${lvl}`;
                    document.getElementById("stXp").style.width = `${(s.games % 10) * 10}%`;
                    document.getElementById("stAp").textContent = `AP ${s.sealed}/${s.sealed}`;
                    document.getElementById("stCaps").textContent = `CAPS ${fmtMoney(s.value)}`;
                };

                // ---- INV: list + detail ---------------------------------------------
                let invRows = [];
                let sel = 0;
                const detailHTML = (row) => {
                    const c = kit.card(row);
                    const yn = (v) => (v === true ? "YES" : v === false ? "NO" : "N/A");
                    return `
                        <div class="inv-art">${c.cover || c.coverL ? kit.img(c.coverL || c.cover) : `<div class="noimg">?</div>`}</div>
                        <div class="inv-title">${escapeHtml(c.title)}</div>
                        <div class="inv-stats">
                            <div><span>PLATFORM</span><span>${escapeHtml(c.consoleName)}</span></div>
                            <div><span>EDITION</span><span>${escapeHtml(c.edition)}</span></div>
                            <div><span>VAL</span><span>${c.value > 0 ? fmtMoney(c.value) : "—"}</span></div>
                            <div><span>PAID</span><span>${c.tbc ? "NOT OWNED" : fmtMoney(c.paid)}</span></div>
                            <div><span>GAIN</span><span class="${c.gain < 0 ? "delta-down" : ""}">${c.value > 0 || c.paid > 0 ? fmtSigned(c.gain) : "—"}</span></div>
                            <div><span>COVER ART</span><span>${yn(c.hasCoverArt)}</span></div>
                            <div><span>INSERT</span><span>${yn(c.hasInsert)}</span></div>
                            <div><span>SEALED</span><span>${c.sealed ? "YES" : "NO"}</span></div>
                            <div><span>COMPLETED</span><span>${c.completed ? "YES" : "NOT YET"}</span></div>
                            <div><span>ACQUIRED</span><span>${escapeHtml(c.date || "—")}</span></div>
                        </div>
                        <div class="inv-hint">[ CLICK / ENTER ] INSPECT</div>`;
                };
                const select = (i, scroll) => {
                    if (!invRows.length) return;
                    sel = Math.max(0, Math.min(invRows.length - 1, i));
                    document.querySelectorAll(".inv-row").forEach((r, j) => r.classList.toggle("sel", j === sel));
                    const d = document.getElementById("invDetail");
                    if (d) d.innerHTML = detailHTML(invRows[sel]);
                    if (scroll) document.querySelectorAll(".inv-row")[sel]?.scrollIntoView({ block: "nearest" });
                };
                window.displayCards = function (data) {
                    const grid = document.getElementById("cardsGrid");
                    document.getElementById("invCount").textContent = `${data.length} ITEMS`;
                    invRows = data;
                    if (!data.length) {
                        grid.innerHTML = kit.empty();
                        return;
                    }
                    grid.innerHTML = `
                        <div>
                            <div class="inv-head"><span></span><span>ITEM</span><span>PLATFORM</span><span style="min-width:70px;text-align:right">VAL</span></div>
                            <div class="inv-list">
                                ${data
                                    .map((row, i) => {
                                        const c = kit.card(row);
                                        const mark = c.tbc ? "○" : c.sealed ? "★" : c.completed ? "✓" : "■";
                                        return `<div class="inv-row${c.tbc ? " tbc" : ""}" data-i="${i}">
                                            <span class="mark">${mark}</span>
                                            <span class="t">${escapeHtml(c.title)}${c.edition !== "Standard" ? ` <span class="dim">(${escapeHtml(c.edition)})</span>` : ""}${c.dup ? ` <span class="dim">${escapeHtml(c.date)}</span>` : ""}</span>
                                            <span class="dim">${escapeHtml(c.consoleName)}</span>
                                            <span class="v ${c.priced && c.gain < 0 ? "down" : ""}">${c.value > 0 ? fmtMoney(c.value) : "—"}</span>
                                        </div>`;
                                    })
                                    .join("")}
                            </div>
                        </div>
                        <aside class="inv-detail" id="invDetail"></aside>`;
                    grid.querySelectorAll(".inv-row").forEach((r) => {
                        const i = Number(r.dataset.i);
                        r.onmouseenter = () => {
                            select(i);
                            kit.sfx("blip");
                        };
                        r.onclick = () => openModal(data[i], i);
                    });
                    select(Math.min(sel, data.length - 1));
                };
                document.addEventListener("keydown", (e) => {
                    const t = e.target;
                    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
                    if (!document.getElementById("pane-inv").classList.contains("on") || currentView !== "grid") return;
                    if (!document.getElementById("modal").classList.contains("hidden") || anyOverlayOpen()) return;
                    if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1, true); kit.sfx("blip"); }
                    if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1, true); kit.sfx("blip"); }
                    if (e.key === "Enter" && invRows[sel]) openModal(invRows[sel], sel);
                });

                // ---- MAP: one territory per console ------------------------------------
                THEME.onData = () => {
                    const counts = {};
                    allData.filter((r) => !isTBC(r)).forEach((r) => {
                        const n = normalizeConsole(r["Console Version"]);
                        if (!counts[n]) counts[n] = { n: 0, v: 0 };
                        counts[n].n++;
                        counts[n].v += rowValue(r);
                    });
                    const max = Math.max(1, ...Object.values(counts).map((c) => c.n));
                    document.getElementById("map").innerHTML = Object.entries(counts)
                        .sort((a, b) => b[1].n - a[1].n)
                        .map(([name, c]) => {
                            const span = c.n / max > 0.5 ? "grid-column:span 2;grid-row:span 2" : c.n / max > 0.2 ? "grid-row:span 2" : "";
                            return `<div class="terr" style="--d:${(c.n / max).toFixed(2)};${span}" data-console="${escapeHtml(name)}"><b>${escapeHtml(name.toUpperCase())}</b><span>${c.n} games · ${fmtMoney(c.v)}</span></div>`;
                        })
                        .join("");
                    document.querySelectorAll("#map [data-console]").forEach((t) => (t.onclick = () => filterToConsole(t.dataset.console)));
                };

                // ---- RADIO -------------------------------------------------------------
                const STATIONS = ["Diamond City Radio", "Classical Radio", "Radio Freedom", "Galaxy News Radio", "Collection FM", "Distress Signal"];
                let station = 0;
                document.getElementById("stations").innerHTML = STATIONS.map((s, i) => `<button class="station${i === 0 ? " on" : ""}" data-i="${i}">${s}</button>`).join("");
                document.querySelectorAll(".station").forEach((b) => {
                    b.onclick = () => {
                        station = Number(b.dataset.i);
                        document.querySelectorAll(".station").forEach((x) => x.classList.toggle("on", x === b));
                        kit.sfx("blip");
                    };
                });
                let waving = false;
                const startWave = () => {
                    if (waving) return;
                    waving = true;
                    const cv = document.getElementById("wave");
                    const ctx = cv.getContext("2d");
                    let t = 0;
                    const draw = () => {
                        ctx.clearRect(0, 0, cv.width, cv.height);
                        ctx.strokeStyle = "#41ff8a";
                        ctx.shadowColor = "#41ff8a";
                        ctx.shadowBlur = 10;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        const f = 1 + station * 0.7;
                        for (let x = 0; x <= cv.width; x += 4) {
                            const y = cv.height / 2 + Math.sin(x * 0.02 * f + t) * 50 * Math.sin(t * 0.3 + station) + Math.sin(x * 0.07 + t * 2) * 12 * (station % 3) + (station === 5 ? (Math.random() - 0.5) * 30 : 0);
                            x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                        }
                        ctx.stroke();
                        t += 0.06;
                        if (document.getElementById("pane-radio").classList.contains("on")) requestAnimationFrame(draw);
                        else waving = false;
                    };
                    draw();
                };
            })();
        </script>
        <script src="theme-nav.js"></script>
    </body>
</html>
