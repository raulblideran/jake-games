<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7ee35f" />
            <stop offset="0.55" stop-color="#3fb82c" />
            <stop offset="1" stop-color="#107c10" />
        </linearGradient>
        <radialGradient id="guide">
            <stop offset="0" stop-color="#eaffdf" />
            <stop offset="1" stop-color="#9cf27f" />
        </radialGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="#0a0a0a" />
    <!-- Controller body: wide shoulders, grips flaring down and out -->
    <path
        fill="url(#body)"
        d="M14 16.5C18.5 14.5 24 15.5 27 17.5H37C40 15.5 45.5 14.5 50 16.5C55.5 18.5 58.5 27 60.3 38C62 48 59.3 53.5 55 53.5C51 53.5 48 47.5 45.2 43.5H18.8C16 47.5 13 53.5 9 53.5C4.7 53.5 2 48 3.7 38C5.5 27 8.5 18.5 14 16.5Z"
    />
    <!-- Guide button -->
    <circle cx="32" cy="22.5" r="3.2" fill="url(#guide)" />
    <!-- Left stick (top-left, offset like an Xbox pad) -->
    <circle cx="18.5" cy="27.5" r="5.6" fill="#0a0a0a" />
    <circle cx="18.5" cy="27.5" r="3.2" fill="#1f2a1c" />
    <!-- D-pad -->
    <path fill="#0a0a0a" d="M24.3 32.6h3.4v3.2h3.2v3.4h-3.2v3.2h-3.4v-3.2h-3.2v-3.4h3.2z" />
    <!-- Right stick -->
    <circle cx="39.5" cy="37.5" r="4.6" fill="#0a0a0a" />
    <circle cx="39.5" cy="37.5" r="2.5" fill="#1f2a1c" />
    <!-- ABXY -->
    <circle cx="46" cy="22.6" r="2.5" fill="#facc15" stroke="#0a0a0a" stroke-width="1" />
    <circle cx="41.6" cy="27" r="2.5" fill="#38bdf8" stroke="#0a0a0a" stroke-width="1" />
    <circle cx="50.4" cy="27" r="2.5" fill="#f43f5e" stroke="#0a0a0a" stroke-width="1" />
    <circle cx="46" cy="31.4" r="2.5" fill="#bbf7d0" stroke="#0a0a0a" stroke-width="1" />
</svg>
